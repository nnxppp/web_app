<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f0f0;
    }

    .contact-card {
      background-color: #6ecf6e;
      border-radius: 8px;
      padding: 30px 30px 30px 30px;
      width: 260px;
    }

    .contact-card h1 {
      text-align: center;
      color: white;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin-bottom: 18px;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 5px;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    .radio-group input[type="radio"] {
      accent-color: #4CAF50;
      width: 15px;
      height: 15px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      color: white;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid white;
      outline: none;
      color: white;
      font-size: 13px;
      padding: 4px 0;
    }

    .form-group input[type="text"]::placeholder,
    .form-group input[type="email"]::placeholder,
    .form-group textarea::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .form-group textarea {
      resize: vertical;
      height: 60px;
      border: none;
      border-bottom: 1px solid white;
      padding: 0;
    }

    .btn-submit {
      margin-top: 16px;
      background-color: white;
      color: #4CAF50;
      border: none;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-submit:hover {
      background-color: #e8e8e8;
    }
  </style>
</head>
<body>
  <div class="contact-card">
    <h1>Contact Us</h1>

    <div class="radio-group">
      <label>
        <input type="radio" name="contact-type" value="say-hi" checked>
        Say Hi
      </label>
      <label>
        <input type="radio" name="contact-type" value="get-a-quote">
        Get a Quote
      </label>
    </div>

    <div class="form-group">
      <label>Your Name</label>
      <input type="text" placeholder="">
    </div>

    <div class="form-group">
      <label>Your Email</label>
      <input type="email" placeholder="">
    </div>

    <div class="form-group">
      <label>Your Message</label>
      <textarea></textarea>
    </div>

    <button class="btn-submit">SUBMIT</button>
  </div>
</body>
</html>
