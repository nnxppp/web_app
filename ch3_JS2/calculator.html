<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #129dfd;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            background-color: #ffffff;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 320px;
        }

        .display {
            background-color: #f7f7f7;
            color: #333;
            font-size: 26px;
            font-weight: 700;
            text-align: right;
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 22px;
            letter-spacing: 0.5px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            outline: none;
            font-size: 22px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            color: #333;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            transition: background-color 0.2s, opacity 0.2s;
        }

        button:active {
            opacity: 0.7;
            transform: scale(0.98);
        }

        .btn-yellow {
            background-color: #fcd567;
        }

        .btn-blue {
            background-color: #c4e1fb;
        }

        .btn-red {
            background-color: #f45d4c;
            color: white;
        }

        .btn-green {
            background-color: #1ed28a;
            color: white;
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">0</div>
        <div class="buttons">
            <button class="btn-yellow">+</button>
            <button class="btn-yellow">-</button>
            <button class="btn-yellow">×</button>
            <button class="btn-yellow">÷</button>

            <button class="btn-blue">7</button>
            <button class="btn-blue">8</button>
            <button class="btn-blue">9</button>
            <button class="btn-blue">4</button>

            <button class="btn-blue">5</button>
            <button class="btn-blue">6</button>
            <button class="btn-blue">1</button>
            <button class="btn-blue">2</button>

            <button class="btn-blue">3</button>
            <button class="btn-blue">0</button>
            <button class="btn-blue">.</button>
            <button class="btn-red">C</button>

            <button class="btn-green">=</button>
        </div>
    </div>
    <script>
        const display = document.querySelector('.display');
        let expression = '';
        let justCalculated = false;
        const operators = { '+': '+', '-': '-', '×': '*', '÷': '/', 'Ã—': '*', 'Ã·': '/' };

        function show(value = expression) {
            display.textContent = value
                ? value.replaceAll('*', ' × ').replaceAll('/', ' ÷ ')
                : '0';
        }

        function formatNumber(number) {
            return String(Number(number.toFixed(10)));
        }

        function calculate() {
            if (!expression || /[+\-*/]$/.test(expression)) return;
            const normalizedExpression = expression.startsWith('-') ? `0${expression}` : expression;
            const parts = normalizedExpression.match(/\d*\.?\d+|[+\-*/]/g);
            if (!parts || parts.join('') !== normalizedExpression) throw new Error('Invalid expression');

            const values = [Number(parts[0])];
            const pendingOperators = [];
            for (let index = 1; index < parts.length; index += 2) {
                const operator = parts[index];
                const value = Number(parts[index + 1]);
                if (operator === '*' || operator === '/') {
                    const previous = values.pop();
                    if (operator === '/' && value === 0) throw new Error('Cannot divide by zero');
                    values.push(operator === '*' ? previous * value : previous / value);
                } else {
                    pendingOperators.push(operator);
                    values.push(value);
                }
            }

            let result = values[0];
            for (let index = 0; index < pendingOperators.length; index++) {
                result = pendingOperators[index] === '+'
                    ? result + values[index + 1]
                    : result - values[index + 1];
            }
            expression = formatNumber(result);
            show(expression);
            justCalculated = true;
        }

        document.querySelector('.buttons').addEventListener('click', (event) => {
            const button = event.target.closest('button');
            if (!button) return;
            const value = button.textContent.trim();

            if (value === 'C') {
                expression = '';
                justCalculated = false;
                show();
            } else if (value === '=') {
                try { calculate(); }
                catch {
                    display.textContent = 'Error';
                    expression = '';
                }
            } else if (operators[value]) {
                if (!expression && value !== '-') return;
                expression = expression.replace(/[+\-*/]$/, '') + operators[value];
                justCalculated = false;
                show();
            } else {
                if (justCalculated) expression = '';
                const currentNumber = expression.split(/[+\-*/]/).pop();
                if (value === '.' && currentNumber.includes('.')) return;
                expression += value === '.' && !currentNumber ? '0.' : value;
                justCalculated = false;
                show();
            }
        });
    </script>
</body>
</html>
