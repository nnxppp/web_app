<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .todo-app {
            width: min(100%, 420px);
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, .14);
        }

        #task-input {
            width: 100%;
            height: 52px;
            padding: 0 14px;
            border: 0;
            border-bottom: 2px solid #4388ff;
            outline: none;
            color: #111;
            font-size: 14px;
        }

        #task-input::placeholder { color: #c8cbd0; }

        #task-list {
            margin: 0;
            padding: 0;
            list-style: none;
            background: #fffb00;
        }

        .task {
            display: flex;
            align-items: center;
            min-height: 50px;
            padding: 0 13px 0 14px;
            border-bottom: 2px dotted #a5b8ff;
            color: #111;
            font-size: 13px;
            font-weight: 600;
        }

        .task:last-child { border-bottom: 0; }
        .task.done .task-name { text-decoration: line-through; opacity: .55; }
        .task-name { flex: 1; overflow-wrap: anywhere; }

        .icon-button {
            width: 15px;
            height: 15px;
            margin-left: 7px;
            padding: 0;
            border: 0;
            border-radius: 2px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            line-height: 15px;
            text-align: center;
        }

        .complete { background: #079d2c; color: white; }
        .delete { background: #ff1717; color: #ffeb00; font-size: 10px; }
        .icon-button:active { transform: scale(.9); }
    </style>
</head>
<body>
    <main class="todo-app">
        <input id="task-input" type="text" placeholder="Enter your task" aria-label="New task">
        <ul id="task-list">
            <li class="task"><span class="task-name">todo 1</span><button class="icon-button complete" aria-label="Complete task">✓</button><button class="icon-button delete" aria-label="Delete task">▰</button></li>
            <li class="task"><span class="task-name">todo 2</span><button class="icon-button complete" aria-label="Complete task">✓</button><button class="icon-button delete" aria-label="Delete task">▰</button></li>
            <li class="task"><span class="task-name">todo3</span><button class="icon-button complete" aria-label="Complete task">✓</button><button class="icon-button delete" aria-label="Delete task">▰</button></li>
        </ul>
    </main>
    <script>
        const input = document.querySelector('#task-input');
        const list = document.querySelector('#task-list');

        function addTask(name) {
            const task = document.createElement('li');
            task.className = 'task';
            task.innerHTML = `<span class="task-name"></span><button class="icon-button complete" aria-label="Complete task">✓</button><button class="icon-button delete" aria-label="Delete task">▰</button>`;
            task.querySelector('.task-name').textContent = name;
            list.append(task);
        }

        input.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter') return;
            const name = input.value.trim();
            if (!name) return;
            addTask(name);
            input.value = '';
        });

        list.addEventListener('click', (event) => {
            const button = event.target.closest('button');
            if (!button) return;
            const task = button.closest('.task');
            if (button.classList.contains('complete')) task.classList.toggle('done');
            if (button.classList.contains('delete')) task.remove();
        });
    </script>
</body>
</html>
