<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <style>
        body {
            margin: 8px;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin: 0;
            color: #202a33;
            font-size: 48px;
            font-weight: 400;
            line-height: 1.2;
        }

        #number {
            width: 49px;
            margin: 25px 0 19px 65px;
            color: #ff0a0a;
            font-size: 72px;
            line-height: 1;
            text-align: center;
        }

        button {
            height: 33px;
            padding: 4px 9px;
            border: 0;
            border-radius: 4px;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        #number + button {
            margin-left: 29px;
            background: #c9344b;
            box-shadow: inset 0 0 0 2px #f2a1ad;
            font-size: 22px;
            line-height: 1;
        }

        button:nth-of-type(2) {
            margin-left: 2px;
            background: #68737b;
        }

        button:nth-of-type(3) {
            margin-left: 2px;
            background: #138a59;
            font-size: 22px;
            font-weight: 700;
            line-height: 1;
        }
    </style>
</head>
<script>
    let count = 0;

    function updateDisplay(){
        document.getElementById("number").textContent = count;
    }
    function decrement(){
        count--;
        updateDisplay();
    }
    function reset(){
        count = 0;
        updateDisplay();
    }
    function increment(){
        count++;
        updateDisplay();
    }
</script>
<body>
    <h1>Counter</h1>
    <p id="number"></p>
    <button onclick="decrement()">-</button>
    <button onclick="reset()">Reset</button>
    <button onclick="increment()">+</button>
</body>
</html>
