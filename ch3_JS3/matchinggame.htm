<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>เกมจับคู่</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Tahoma, sans-serif;
        background: #fff;
      }
      main {
        width: min(92vw, 900px);
      }
      h1 {
        width: fit-content;
        margin: 0 auto 48px;
        padding: 8px 12px;
        font-size: 28px;
        font-weight: 400;
        background: #d4dfbe;
        border: 1px solid #bac99a;
      }
      .layout {
        display: block;
      }
      .board {
        width: 360px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        padding: 8px;
        background: #fff9cf;
        margin-inline: auto;
      }
      .card {
        aspect-ratio: 1;
        border: 0;
        background: #b8df89;
        font-size: 52px;
        cursor: pointer;
        transition:
          transform 0.16s,
          background 0.16s;
      }
      .card:hover:not(:disabled) {
        transform: scale(1.04);
      }
      .card.hidden {
        font-size: 48px;
        color: #000;
      }
      .card.matched {
        background: #dff2c7;
        cursor: default;
      }
      .instructions {
        font-size: 20px;
        line-height: 1.8;
      }
      .instructions p {
        margin: 0 0 24px;
      }
      .reset {
        width: 360px;
        display: block;
        margin: 23px auto 0;
        border: 0;
        border-radius: 11px;
        padding: 8px;
        background: #78845b;
        color: #fff;
        font-size: 36px;
        cursor: pointer;
      }
      #status {
        min-height: 28px;
        margin: 0 0 10px;
        color: #46512f;
        font-size: 18px;
        text-align: center;
      }
      @media (max-width: 950px) {
        main {
          padding: 24px 0;
        }
          h1 { margin: 0 auto 25px; }
        .layout {
          grid-template-columns: 1fr;
          gap: 22px;
        }
        .board,
        .reset {
          width: min(92vw, 360px);
          margin-inline: auto;
        }
        .instructions {
          padding: 0 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>เกมจับคู่</h1>
      <div class="layout">
        <div>
          <p id="status" aria-live="polite">เลือกไพ่ 2 ใบเพื่อจับคู่</p>
          <section
            class="board"
            id="board"
            aria-label="กระดานเกมจับคู่"
          ></section>
          <button class="reset" id="reset" type="button">Reset</button>
        </div>
      </div>
    </main>
    <script>
      const fruits = ["🍇", "🍎", "🍍", "🍊", "🍓", "🍉", "🍒", "🍌"];
      const board = document.getElementById("board");
      const status = document.getElementById("status");
      let firstCard,
        secondCard,
        locked,
        gameNumber = 0;
      const shuffle = (cards) => [...cards].sort(() => Math.random() - 0.5);
      function newGame() {
        gameNumber++;
        firstCard = secondCard = null;
        locked = false;
        status.textContent = "เลือกไพ่ 2 ใบเพื่อจับคู่";
        board.innerHTML = "";
        shuffle([...fruits, ...fruits]).forEach((fruit, index) => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "card hidden";
          card.textContent = "?";
          card.dataset.fruit = fruit;
          card.dataset.index = index;
          card.setAttribute("aria-label", "ไพ่คว่ำ");
          card.addEventListener("click", reveal);
          board.append(card);
        });
      }
      function reveal(event) {
        const card = event.currentTarget;
        if (locked || card === firstCard || card.classList.contains("matched"))
          return;
        card.textContent = card.dataset.fruit;
        card.classList.remove("hidden");
        card.setAttribute("aria-label", "ไพ่ " + card.dataset.fruit);
        if (!firstCard) {
          firstCard = card;
          return;
        }
        secondCard = card;
        locked = true;
        if (firstCard.dataset.fruit === secondCard.dataset.fruit) {
          firstCard.classList.add("matched");
          secondCard.classList.add("matched");
          firstCard = secondCard = null;
          locked = false;
          if (document.querySelectorAll(".matched").length === 16)
            status.textContent = "ยินดีด้วย! จับคู่ครบแล้ว";
          else status.textContent = "จับคู่ถูกต้อง! เลือกไพ่ต่อได้";
        } else {
          status.textContent = "ยังไม่ตรงกัน กำลังปิดไพ่...";
          const cardsToHide = [firstCard, secondCard];
          const currentGame = gameNumber;
          setTimeout(() => {
            if (currentGame !== gameNumber) return;
            cardsToHide.forEach((item) => {
              item.textContent = "?";
              item.classList.add("hidden");
              item.setAttribute("aria-label", "ไพ่คว่ำ");
            });
            firstCard = secondCard = null;
            locked = false;
            status.textContent = "เลือกไพ่ 2 ใบเพื่อจับคู่";
          }, 2000);
        }
      }
      document.getElementById("reset").addEventListener("click", newGame);
      newGame();
    </script>
  </body>
</html>
