<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1b9dff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .chat-container {
            width: 380px;
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: #116df6;
            color: white;
            text-align: center;
            padding: 25px 0;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .chat-body {
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background-color: #ffffff;
        }

        .message {
            display: flex;
            width: 100%;
        }

        .message-right {
            justify-content: flex-end;
        }

        .message-left {
            justify-content: flex-start;
        }

        .bubble {
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 15px;
            max-width: 85%;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .bubble-right {
            background-color: #116df6;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bubble-left {
            background-color: #f1f1f1;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .bubble-left strong {
            font-weight: 700;
            color: #000;
        }

        .chat-footer {
            background-color: #f1f1f1;
            padding: 15px 20px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-footer input {
            flex: 1;
            padding: 12px 18px;
            border: none;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
            color: #333;
        }

        .chat-footer input::placeholder {
            color: #999;
        }

        .chat-footer button {
            background-color: #116df6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .chat-footer button:hover {
            background-color: #0c57c4;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            CHAT APP
        </div>
        <div class="chat-body">
            <div class="message message-right">
                <div class="bubble bubble-right">You are my Bae❤️ :Abby</div>
            </div>
            <div class="message message-left">
                <div class="bubble bubble-left"><strong>JK:</strong> ooooo🙈</div>
            </div>
            <div class="message message-right">
                <div class="bubble bubble-right">🥺🥺 :Abby</div>
            </div>
            <div class="message message-left">
                <div class="bubble bubble-left"><strong>JK:</strong> you are my Bee</div>
            </div>
            <div class="message message-right">
                <div class="bubble bubble-right">😂😂 :Abby</div>
            </div>
            <div class="message message-left">
                <div class="bubble bubble-left"><strong>JK:</strong> You got it right?</div>
            </div>
            <div class="message message-right">
                <div class="bubble bubble-right">yeah😘 :Abby</div>
            </div>
            <div class="message message-left">
                <div class="bubble bubble-left"><strong>JK:</strong> 🥺😍</div>
            </div>
        </div>
        <div class="chat-footer">
            <input type="text" placeholder="Type a message...">
            <button>Send</button>
        </div>
    </div>
</body>
</html>
