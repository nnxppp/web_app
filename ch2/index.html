<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Cards</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 40px;
        min-height: 100vh;
        padding: 20px;
        flex-wrap: wrap;
      }
      .card1 {
        background-color: #ffffff;
        width: 280px;
        border-radius: 4px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        text-align: center;
      }
      .card1 .profile-img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        display: block;
      }
      .card1 .content {
        padding: 25px 20px;
      }
      .card1 h1 {
        font-size: 32px;
        color: #000000;
        font-weight: 400;
        margin-bottom: 15px;
      }
      .card1 .title {
        font-size: 14px;
        color: #888888;
        margin-bottom: 15px;
      }
      .card1 .university {
        font-size: 13px;
        color: #000000;
        margin-bottom: 5px;
      }
      .card1 .btn-contact {
        background-color: #000000;
        color: #ffffff;
        border: none;
        width: 100%;
        padding: 12px 0;
        font-size: 14px;
        cursor: pointer;
        display: block;
        text-decoration: none;
        transition: background-color 0.2s;
      }
      .card1 .btn-contact:hover {
        background-color: #222222;
      }
      .card2 {
        background-color: #9932cc;
        width: 280px;
        padding: 35px 20px;
        border-radius: 24px;
        text-align: center;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      }
      .card2 .profile-img {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        border: 4px solid #ffffff;
        object-fit: cover;
        margin: 0 auto 20px auto;
        display: block;
      }
      .card2 h1 {
        color: #ffffff;
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .card2 .location {
        color: #e0b0ff;
        font-size: 13px;
        margin-bottom: 25px;
      }
      .card2 .role {
        color: #ffffff;
        font-size: 14px;
        line-height: 1.4;
        margin-bottom: 30px;
      }
      .card2 .btn-message {
        background-color: #ffffff;
        color: #333333;
        border: none;
        width: 100%;
        padding: 10px 0;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .card2 .btn-message:hover {
        background-color: #f1f1f1;
      }
    </style>
  </head>
  <body>

    <div class="card1">
      <img src="img/image.jpg" alt="Thanyarat" class="profile-img" />
      <div class="content">
        <h1>Thanyarat Raewan</h1>
        <p class="title">Computer Engineering</p>
        <p class="university">Kasetsart University</p>
      </div>
      <button class="btn-contact">Contact</button>
    </div>

    <div class="card2">
      <img src="img/lunar.jpeg" alt="Lunar" class="profile-img" />
      <h1>Lunar</h1>
      <p class="location">GMM Grammy 31th Floor </p>
      <p class="role">Official Mascot of NamtanFilm<br />The Cute Panda & Duck </p>
      <button class="btn-message">Message</button>
    </div>

  </body>
</html>
